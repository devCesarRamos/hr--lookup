<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RH – Pesquisa de Colaborador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Pesquisa de Colaborador</h1>

        <form method="get" action="/">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   value="{{ username }}" placeholder="ex.: ana.exemplo" required>
            <button type="submit">Pesquisar</button>
        </form>

        {% if employee %}
            <section class="result">
                <h2>Colaborador encontrado</h2>
                <dl>
                    <dt>Username</dt><dd>{{ employee.username }}</dd>
                    <dt>Email</dt><dd>{{ employee.email }}</dd>
                    <dt>Morada</dt><dd>{{ employee.address }}</dd>
                </dl>
            </section>
        {% elif searched %}
            <p class="error">Colaborador "{{ username }}" não encontrado.</p>
        {% endif %}
    </main>
</body>
</html>
